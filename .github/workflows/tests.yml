name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: docker compose up -d

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for app container to be ready..."
          for i in {1..100}; do
            if docker compose exec -T app pg_isready -h localhost -p 5432 -U dev 2>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/100)"
            sleep 2
            if [ $i -eq 100 ]; then
              echo "PostgreSQL failed to start after 100 attempts"
              docker compose logs app
              exit 1
            fi
          done

      - name: Build project
        run: docker compose exec -T app npm run build

      - name: Type check
        run: docker compose exec -T app npm run check-types

      - name: Check formatting
        run: docker compose exec -T app npx prettier --check . --ignore-path .gitignore --ignore-path .prettierignore

      - name: Verify every module loads under Node ESM
        run: docker compose exec -T app npm run smoke-import

      - name: Run tests
        run: docker compose exec -T app npm test
        env:
          CI: true

      - name: Audit dependencies
        run: docker compose exec -T app npm audit --audit-level=critical

      # The Rust workspace in rust/ is replacing src/ stage by stage. Both pipelines
      # coexist until the port completes, so both are checked here; the TypeScript steps
      # above are retired per stage as each port lands.
      - name: Check the generated format enums are in sync
        run: docker compose exec -T app node rust/codegen/generate-format-enums.mjs --check

      - name: Check the convention region data is in sync
        run: docker compose exec -T app node rust/codegen/generate-convention-regions.mjs --check

      - name: Check the format test vectors are in sync
        run: docker compose exec -T app node rust/codegen/generate-format-vectors.mjs --check

      - name: Check the formatter test vectors are in sync
        run: docker compose exec -T app node rust/codegen/generate-formatter-vectors.mjs --check

      - name: Check the OSM converter scenes are in sync
        run: docker compose exec -T app node rust/codegen/generate-osm-scenes.mjs --check

      - name: Check the topology scenes are in sync
        run: docker compose exec -T app node rust/codegen/generate-topology-scenes.mjs --check

      - name: Check the run-merge vectors are in sync
        run: docker compose exec -T app node rust/codegen/generate-merge-vectors.mjs --check

      - name: Check the normalization scenes are in sync
        run: docker compose exec -T app node rust/codegen/generate-normalize-scenes.mjs --check

      - name: Check the viewport hint vectors are in sync
        run: docker compose exec -T app node rust/codegen/generate-viewport-vectors.mjs --check

      - name: Check the feature id vectors are in sync
        run: docker compose exec -T app node rust/codegen/generate-id-vectors.mjs --check

      - name: Check the geometry validity vectors are in sync
        run: docker compose exec -T app node rust/codegen/generate-validity-vectors.mjs --check

      - name: Check the format-stage scenes are in sync
        run: docker compose exec -T app node rust/codegen/generate-format-scenes.mjs --check

      - name: Check the turf vectors are in sync
        run: docker compose exec -T app node rust/codegen/generate-turf-vectors.mjs --check

      - name: Check the output formatter vectors are in sync
        run: docker compose exec -T app node rust/codegen/generate-output-vectors.mjs --check

      - name: Check the ISO 3166 data is in sync
        run: docker compose exec -T app node rust/codegen/generate-iso3166-data.mjs --check

      - name: Check the geocoded scenes are in sync
        run: docker compose exec -T app node rust/codegen/generate-geocoded-scenes.mjs --check

      - name: Check the geocode vectors are in sync
        run: docker compose exec -T app node rust/codegen/generate-geocode-vectors.mjs --check

      - name: Check the collation vectors are in sync
        run: docker compose exec -T app node rust/codegen/generate-collation-vectors.mjs --check

      - name: Check the places vectors are in sync
        run: docker compose exec -T app node rust/codegen/generate-places-vectors.mjs --check

      - name: Check the geohash vectors are in sync
        run: docker compose exec -T app node rust/codegen/generate-geohash-vectors.mjs --check

      - name: Check the elevation vectors are in sync
        run: docker compose exec -T app node rust/codegen/generate-elevation-vectors.mjs --check

      - name: Check the metadata vectors are in sync
        run: docker compose exec -T app node rust/codegen/generate-metadata-vectors.mjs --check

      - name: Check the GeoPackage scenes are in sync
        run: docker compose exec -T app node rust/codegen/generate-gpkg-scenes.mjs --check

      - name: Rust format
        run: docker compose exec -T app sh -c "cd rust && cargo fmt --all --check"

      - name: Rust check
        run: docker compose exec -T app sh -c "cd rust && cargo check --workspace --all-targets"

      - name: Rust tests
        run: docker compose exec -T app sh -c "cd rust && cargo test --workspace"

      - name: Cleanup
        if: always()
        run: docker compose down
