name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: docker compose up -d

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for app container to be ready..."
          for i in {1..100}; do
            if docker compose exec -T app pg_isready -h localhost -p 5432 -U dev 2>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/100)"
            sleep 2
            if [ $i -eq 100 ]; then
              echo "PostgreSQL failed to start after 100 attempts"
              docker compose logs app
              exit 1
            fi
          done

      - name: Build project
        run: docker compose exec -T app npm run build

      - name: Type check
        run: docker compose exec -T app npm run check-types

      - name: Check formatting
        run: docker compose exec -T app npx prettier --check . --ignore-path .gitignore

      - name: Verify every module loads under Node ESM
        run: docker compose exec -T app npm run smoke-import

      - name: Run tests
        run: docker compose exec -T app npm test
        env:
          CI: true

      - name: Audit dependencies
        run: docker compose exec -T app npm audit --audit-level=critical

      - name: Cleanup
        if: always()
        run: docker compose down
